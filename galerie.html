<script>
(function(){var lb=document.getElementById('lb'),im=lb.querySelector('img'),cap=lb.querySelector('figcaption'),list=[],i=0;
function show(){var a=list[i];im.src=a.getAttribute('href');im.alt=a.dataset.titre||'';cap.innerHTML=a.dataset.legende||'';}
document.addEventListener('click',function(e){var a=e.target.closest('a.zoom');if(!a)return;e.preventDefault();
list=[].slice.call(document.querySelectorAll('a.zoom')).filter(function(x){return x.offsetParent!==null||x===a;});i=list.indexOf(a);show();lb.hidden=false;document.body.style.overflow='hidden';});
function close(){lb.hidden=true;document.body.style.overflow='';im.src='';}
lb.querySelector('.lb-x').onclick=close;lb.onclick=function(e){if(e.target===lb)close();};
lb.querySelector('.lb-p').onclick=function(){i=(i-1+list.length)%list.length;show();};
lb.querySelector('.lb-n').onclick=function(){i=(i+1)%list.length;show();};
document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')lb.querySelector('.lb-p').click();if(e.key==='ArrowRight')lb.querySelector('.lb-n').click();});
})();
</script></body></html>
